
services:

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    ports:
      - "9005:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    container_name: code_arena_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - minio
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
    command: sh -c "npm install && node server.js"

  frontend:
    build: ./frontend
    container_name: code_arena_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - VITE_PROXY_TARGET=http://backend:5000
      - VITE_API_URL=/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mongo-data:
  minio-data:
  backend_node_modules:
  frontend_node_modules:
