
services:


  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    ports:
      - "9005:9000"
      - "9001:9001"
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123 
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    container_name: code_arena_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - minio
    volumes:
      - ./backend:/app
      - /app/node_modules    
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/online_judge
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000

  frontend:
    build: ./frontend
    container_name: code_arena_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env


volumes:
  mongo-data:
  minio-data:
    
